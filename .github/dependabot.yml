version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # TS 7 es el compilador nativo; typescript-eslint exige typescript <6.1.0.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # vite-ssg 28 solo soporta @unhead/vue v2; v3 rompe el head del SSG.
      - dependency-name: "@unhead/vue"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore"
      include: "scope"
