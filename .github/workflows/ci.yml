name: CI

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      # npm ci falla si package.json y package-lock.json no coinciden o si hay
      # conflictos de peer dependencies (fue lo que rompió el PR #143).
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test:run
      - name: Build (SSG)
        run: npm run build
        env:
          VITE_SITE_URL: https://luynoxrd.github.io/ILUMINATY
